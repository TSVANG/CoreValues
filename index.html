<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Мои 10 Ценностей</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap');
        
        /* 1. Блокировка выделения и контекстного меню */
        * {
            -webkit-user-select: none; /* Safari */
            -ms-user-select: none; /* IE 10 and IE 11 */
            user-select: none; /* Standard syntax */
            -webkit-touch-callout: none; /* iOS Safari context menu */
        }

        /* 2. Блокировка прокрутки всего тела страницы */
        body {
            font-family: 'Montserrat', sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            height: 100vh;
            width: 100vw;
            overflow: hidden; /* Запрет скролла */
            touch-action: none; /* Запрет стандартных жестов браузера */
            position: fixed; /* Фиксация экрана */
        }

        /* Анимации */
        .card-enter {
            animation: fadeInUp 0.4s ease-out forwards;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .value-card {
            transition: all 0.2s cubic-bezier(0.25, 0.8, 0.25, 1);
            touch-action: manipulation; /* Улучшение реакции на тач */
        }

        .value-card:active {
            transform: scale(0.92);
        }

        .throwing-away {
            animation: throwAway 0.4s forwards;
        }

        @keyframes throwAway {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(0.5) rotate(10deg); opacity: 0.5; }
            100% { transform: scale(0) translateY(50px); opacity: 0; }
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 4px 16px 0 rgba(31, 38, 135, 0.1);
        }

        /* Скроллбар внутри контента */
        .custom-scroll {
            overflow-y: auto;
            touch-action: pan-y; /* Разрешаем скролл только внутри контейнера */
            -webkit-overflow-scrolling: touch;
        }
        
        .custom-scroll::-webkit-scrollbar { width: 4px; }
        .custom-scroll::-webkit-scrollbar-track { background: transparent; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e0; border-radius: 4px; }

        /* 4. Адаптация под малые экраны (240x360) */
        @media (max-width: 380px) {
            h1 { font-size: 1rem !important; }
            h2 { font-size: 1.1rem !important; }
            .value-card { padding: 0.4rem !important; min-height: 36px !important; }
            .value-card span { font-size: 0.75rem !important; line-height: 1.1; }
            .game-btn { padding: 0.5rem 1rem !important; font-size: 0.85rem !important; }
        }
        
        @media (max-height: 480px) {
            header { margin-bottom: 0.5rem !important; }
            .glass-panel { padding: 0.75rem !important; margin-bottom: 3.5rem !important; }
            #footerArea { display: none !important; } /* Скрываем футер на очень низких экранах */
        }
    </style>
</head>
<body class="text-slate-800" oncontextmenu="return false;">

    <!-- App Container: Flex layout to fill screen exactly -->
    <div id="app" class="h-full w-full flex flex-col p-2 sm:p-4 max-w-4xl mx-auto relative">
        
        <!-- Header -->
        <header class="flex justify-between items-center mb-2 sm:mb-4 shrink-0 z-20">
            <div class="flex items-center gap-2">
                <div class="w-8 h-8 sm:w-10 sm:h-10 bg-indigo-600 rounded-lg flex items-center justify-center text-white font-bold shadow-md text-sm sm:text-base">
                    <i class="fas fa-gem"></i>
                </div>
                <h1 class="text-base sm:text-xl font-bold text-indigo-900 tracking-tight leading-none">Core<br class="hidden xs:block">Values</h1>
            </div>
            <button onclick="toggleTrashModal()" class="relative group p-1">
                <div class="w-9 h-9 sm:w-12 sm:h-12 bg-white rounded-full flex items-center justify-center shadow hover:shadow-md transition-all text-slate-500 hover:text-red-500 border border-slate-100">
                    <i class="fas fa-trash-alt text-sm sm:text-lg"></i>
                </div>
                <span id="trashCountBadge" class="absolute -top-0 -right-0 bg-red-500 text-white text-[10px] sm:text-xs font-bold w-4 h-4 sm:w-5 sm:h-5 flex items-center justify-center rounded-full transform scale-0 transition-transform duration-200">0</span>
            </button>
        </header>

        <!-- Main Content Area: Flex grow to take remaining space -->
        <main id="gameArea" class="flex-grow flex flex-col relative overflow-hidden">
            <!-- Dynamic Content Injected Here -->
        </main>

        <!-- Footer -->
        <footer id="footerArea" class="mt-2 py-2 border-t border-slate-200/60 text-center text-[10px] sm:text-sm text-slate-400 shrink-0">
            <p>Шаг к пониманию себя</p>
        </footer>

    </div>

    <!-- Trash Modal -->
    <div id="trashModal" class="fixed inset-0 z-50 hidden">
        <div class="absolute inset-0 bg-slate-900/40 backdrop-blur-sm transition-opacity" onclick="toggleTrashModal()"></div>
        <div class="absolute right-0 top-0 h-full w-full max-w-xs bg-white shadow-2xl transform translate-x-full transition-transform duration-300 flex flex-col" id="trashPanel">
            <div class="p-4 border-b border-slate-100 flex justify-between items-center bg-slate-50 shrink-0">
                <h2 class="text-base font-bold text-slate-800"><i class="fas fa-trash-restore mr-2 text-slate-400"></i>Корзина</h2>
                <button onclick="toggleTrashModal()" class="w-8 h-8 flex items-center justify-center rounded-full hover:bg-slate-200 transition-colors">
                    <i class="fas fa-times text-slate-500"></i>
                </button>
            </div>
            <div class="p-3 bg-yellow-50 text-yellow-800 text-xs border-b border-yellow-100 shrink-0">
                <i class="fas fa-info-circle mr-1"></i> Нажмите, чтобы вернуть.
            </div>
            <div id="trashContent" class="flex-grow overflow-y-auto p-4 custom-scroll grid grid-cols-2 gap-2 content-start">
                <!-- Trash items go here -->
            </div>
        </div>
    </div>

    <script>
        // --- DATA ---
        const rawCategories = {
            "Развитие": ["Анализ", "Внимательность", "Гибкость", "Дальновидность", "Делегирование", "Интеллект", "Логика", "Навыки", "Осознанность", "Привычки", "Проницательность", "Сосредоточенность","Уникальность", "Эффективность"],
            "Материальное": ["Активы", "Амбициозность", "Бизнес", "Богатство", "Власть", "Выгода", "Деньги", "Достижение", "Законность", "Инвестиции", "Инновация", "Капитал", "Комфорт", "Конкуренция", "Обладание", "Предприимчивость", "Предпринимательство", "Престиж", "Прибыльность", "Риск", "Роскошь", "Собственность", "Стабильность", "Статус", "Честолюбие"],
            "Самореализация": ["Автономность","Воображение", "Вызов", "Глобальность", "Знания", "Индивидуальность", "Искусность", "Исследование", "Карьера", "Качество", "Компетентность", "Креативность", "Лидерство", "Мастерство", "Мотивация", "Независимость", "Последовательность", "Призвание", "Профессионализм", "Руководство", "Трудолюбие", "Удовлетворенность", "Успех", "Целеустремлённость", "Энтузиазм"],
            "Духовность": ["Аскетизм", "Безмятежность", "Бог", "Гармония", "Глубина", "Истина", "Лёгкость", "Любопытство", "Мудрость", "Познание", "Прозрачность", "Простота", "Смирение", "Созидание", "Сотрудничество", "Сочувствие", "Счастье", "Творчество", "Терпимость", "Тишина", "Толерантность", "Умиротворение", "Философия", "Этичность"],
            "Отношения": ["Альтруизм", "Близость", "Верность", "Доброта", "Доверие", "Дружба", "Искренность", "Красота", "Поддержка", "Преданность", "Принятие", "Радость", "Свобода", "Страсть", "Уверенность в себе", "Чувственность"],
            "Нравственность": ["Вежливость", "Великодушие", "Дисциплина", "Достоинство", "Зрелость", "Отвага", "Ответственность", "Решительность", "Самостоятельность", "Сдержанность", "Смелость", "Спокойствие", "Уверенность","Цельность"],
            "Радость": ["Вдохновение", "Веселье", "Восторг", "Досуг", "Жизнерадостность", "Наслаждение", "Развлечение", "Удивление", "Хобби", "Эстетичность", "Юмор"],
            "Здоровье": ["Активность", "Выносливость", "Естественность", "Ловкость", "Подвижность","Спорт", "Ухоженность", "Фитнес", "Энергичность"],
            "Семья": ["Близкие", "Взаимопонимание", "Дети", "Забота","Принадлежность", "Прощение", "Родственники","Традиции"],
            "Мораль": ["Благородность", "Правда", "Принципиальность", "Равенство", "Справедливость", "Уважение", "Честность", "Честь", "Экологичность"]
        };

        // State
        let gameState = {
            stage: 'intro',
            categoryKeys: Object.keys(rawCategories),
            currentCategoryIndex: 0,
            values: [], 
            trash: [],
            semifinal1_ids: [],
            semifinal2_ids: []
        };

        // --- INIT LOGIC ---
        function initGame() {
            let idCounter = 0;
            gameState.values = [];
            
            gameState.categoryKeys.forEach(cat => {
                rawCategories[cat].forEach(word => {
                    if(!gameState.values.find(v => v.text === word)) {
                        gameState.values.push({
                            id: idCounter++,
                            text: word,
                            category: cat,
                            status: 'active'
                        });
                    }
                });
            });

            renderIntro();
            updateTrashBadge();
            document.addEventListener('touchmove', function(e) { 
                if(!e.target.closest('.custom-scroll')) {
                    e.preventDefault(); 
                }
            }, { passive: false });
        }

        // --- RENDERERS ---

        function renderIntro() {
            const container = document.getElementById('gameArea');
            container.innerHTML = `
                <div class="h-full flex flex-col items-center justify-center p-2 card-enter overflow-y-auto custom-scroll">
                    <div class="glass-panel w-full rounded-2xl p-4 sm:p-8 text-center max-w-lg">
                        <div class="mb-4 inline-block p-3 rounded-full bg-indigo-100 text-indigo-600 text-2xl sm:text-3xl">
                            <i class="fas fa-compass"></i>
                        </div>
                        <h2 class="text-xl sm:text-2xl font-bold text-indigo-900 mb-2">Твои Ценности</h2>
                        <p class="text-slate-600 text-sm sm:text-base mb-6 leading-relaxed">
                            У нас ${gameState.values.length} слов. Это много. Давай отсечем лишнее.
                        </p>
                        <ul class="text-left text-slate-600 mb-6 space-y-2 max-w-xs mx-auto text-xs sm:text-sm">
                            <li class="flex items-start"><i class="fas fa-filter mt-1 text-indigo-500 mr-2"></i> <span><strong>Этап 1:</strong> В каждой категории выкинь 40% слов.</span></li>
                            <li class="flex items-start"><i class="fas fa-layer-group mt-1 text-purple-500 mr-2"></i> <span><strong>Этап 2:</strong> Полуфиналы. Оставшиеся слова делятся на 2 группы. Выкинь 70% в каждой.</span></li>
                            <li class="flex items-start"><i class="fas fa-trophy mt-1 text-green-500 mr-2"></i> <span><strong>Этап 3:</strong> Финал. Оставляем только 10 самых важных.</span></li>
                        </ul>
                        <button onclick="startFiltering()" class="game-btn bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-8 rounded-xl shadow-lg transform active:scale-95 transition-all text-sm sm:text-base w-full sm:w-auto">
                            Поехали
                        </button>
                    </div>
                </div>
            `;
            document.getElementById('footerArea').style.display = 'none';
        }

        function startFiltering() {
            gameState.stage = 'filtering';
            const footer = document.getElementById('footerArea');
            if(footer) footer.style.display = 'block';
            renderCategoryStep();
        }

        function renderCategoryStep() {
            const catName = gameState.categoryKeys[gameState.currentCategoryIndex];
            const catItems = gameState.values.filter(v => v.category === catName && v.status === 'active');
            const totalInCat = rawCategories[catName].length; 
            const currentCount = catItems.length;
            const trashedCount = totalInCat - currentCount;
            const targetTrash = Math.ceil(totalInCat * 0.4);
            const isTargetMet = trashedCount >= targetTrash;
            const percentComplete = Math.min(100, (trashedCount / targetTrash) * 100);

            const container = document.getElementById('gameArea');
            let progressBarColor = isTargetMet ? 'bg-green-500' : 'bg-orange-400';
            
            let itemsHTML = catItems.map(item => `
                <div onclick="throwToTrash(${item.id}, this)" class="value-card bg-white border border-slate-200 rounded-lg p-2 sm:p-4 text-center cursor-pointer shadow-sm relative flex items-center justify-center min-h-[40px] sm:min-h-[70px]">
                    <span class="font-medium text-slate-700 pointer-events-none text-xs sm:text-sm break-words w-full leading-tight">${item.text}</span>
                </div>
            `).join('');

            const btnDisabled = !isTargetMet;
            const btnClass = btnDisabled 
                ? "bg-slate-300 text-slate-500 cursor-not-allowed" 
                : "bg-indigo-600 hover:bg-indigo-700 text-white shadow-lg animate-pulse";
            const btnText = btnDisabled 
                ? `Уберите еще ${targetTrash - trashedCount}` 
                : (gameState.currentCategoryIndex < gameState.categoryKeys.length - 1 ? 'Дальше' : 'К полуфиналу');

            container.innerHTML = `
                <div class="h-full flex flex-col card-enter w-full">
                    <div class="flex-none mb-2 sm:mb-4 px-1">
                        <div class="flex justify-between items-end mb-1">
                             <div class="text-[10px] sm:text-xs font-bold text-indigo-400 uppercase tracking-wider">
                                Категория ${gameState.currentCategoryIndex + 1}/${gameState.categoryKeys.length}
                            </div>
                             <div class="text-[10px] sm:text-xs font-bold ${isTargetMet ? 'text-green-600' : 'text-orange-500'}">
                                Убрано: ${trashedCount}/${targetTrash}
                            </div>
                        </div>
                        <div class="h-2 w-full bg-gray-200 rounded-full overflow-hidden mb-2">
                             <div class="h-full ${progressBarColor} transition-all duration-300" style="width: ${percentComplete}%"></div>
                        </div>
                        <h2 class="text-lg sm:text-2xl font-bold text-slate-800 leading-tight">${catName}</h2>
                        <p class="text-[10px] sm:text-sm text-slate-400 mt-1">Нажми на лишнее, чтобы убрать в корзину.</p>
                    </div>
                    <div class="flex-grow overflow-y-auto custom-scroll glass-panel rounded-xl p-2 sm:p-4 mb-16 sm:mb-20">
                        <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-2 sm:gap-3 pb-4">
                            ${itemsHTML}
                        </div>
                    </div>
                    <div class="absolute bottom-0 left-0 right-0 p-3 sm:p-4 bg-gradient-to-t from-white via-white to-transparent z-10 flex justify-center">
                         <button id="nextBtn" onclick="nextCategory()" ${btnDisabled ? 'disabled' : ''} class="game-btn ${btnClass} w-full max-w-sm py-3 px-6 rounded-xl font-bold transition-all flex items-center justify-center text-sm sm:text-base">
                            ${btnText} ${!btnDisabled ? '<i class="fas fa-arrow-right ml-2"></i>' : ''}
                        </button>
                    </div>
                </div>
            `;
        }

        function nextCategory() {
            const catName = gameState.categoryKeys[gameState.currentCategoryIndex];
            const totalInCat = rawCategories[catName].length;
            const currentItems = gameState.values.filter(v => v.category === catName && v.status === 'active').length;
            const trashedCount = totalInCat - currentItems;
            const targetTrash = Math.ceil(totalInCat * 0.4);

            if (trashedCount < targetTrash) return;

            if (gameState.currentCategoryIndex < gameState.categoryKeys.length - 1) {
                gameState.currentCategoryIndex++;
                renderCategoryStep();
            } else {
                prepareSemifinals();
            }
        }

        // --- SEMIFINALS ---
        function prepareSemifinals() {
            let activeItems = gameState.values.filter(v => v.status === 'active');
            activeItems = activeItems.sort(() => Math.random() - 0.5);

            const half = Math.ceil(activeItems.length / 2);
            gameState.semifinal1_ids = activeItems.slice(0, half).map(v => v.id);
            gameState.semifinal2_ids = activeItems.slice(half).map(v => v.id);

            gameState.stage = 'semifinal_1';
            renderSemifinalStep();
        }

        function renderSemifinalStep() {
            const isGroup1 = gameState.stage === 'semifinal_1';
            const currentGroupIds = isGroup1 ? gameState.semifinal1_ids : gameState.semifinal2_ids;
            
            const catItems = gameState.values.filter(v => currentGroupIds.includes(v.id) && v.status === 'active');
            const totalInCat = currentGroupIds.length; 
            const currentCount = catItems.length;
            const trashedCount = totalInCat - currentCount;
            const targetTrash = Math.ceil(totalInCat * 0.7);
            const isTargetMet = trashedCount >= targetTrash;
            const percentComplete = Math.min(100, (trashedCount / targetTrash) * 100);

            const container = document.getElementById('gameArea');
            let progressBarColor = isTargetMet ? 'bg-green-500' : 'bg-orange-400';
            
            let itemsHTML = catItems.map(item => `
                <div onclick="throwToTrash(${item.id}, this)" class="value-card bg-white border border-slate-200 rounded-lg p-2 sm:p-4 text-center cursor-pointer shadow-sm relative flex items-center justify-center min-h-[40px] sm:min-h-[70px]">
                    <span class="font-medium text-slate-700 pointer-events-none text-xs sm:text-sm break-words w-full leading-tight">${item.text}</span>
                </div>
            `).join('');

            const btnDisabled = !isTargetMet;
            const btnClass = btnDisabled 
                ? "bg-slate-300 text-slate-500 cursor-not-allowed" 
                : "bg-indigo-600 hover:bg-indigo-700 text-white shadow-lg animate-pulse";
            const btnText = btnDisabled 
                ? `Уберите еще ${targetTrash - trashedCount}` 
                : (isGroup1 ? 'Дальше' : 'К финалу');

            container.innerHTML = `
                <div class="h-full flex flex-col card-enter w-full">
                    <div class="flex-none mb-2 sm:mb-4 px-1">
                        <div class="flex justify-between items-end mb-1">
                             <div class="text-[10px] sm:text-xs font-bold text-indigo-400 uppercase tracking-wider">
                                Полуфинал ${isGroup1 ? '1/2' : '2/2'}
                            </div>
                             <div class="text-[10px] sm:text-xs font-bold ${isTargetMet ? 'text-green-600' : 'text-orange-500'}">
                                Убрано: ${trashedCount}/${targetTrash}
                            </div>
                        </div>
                        <div class="h-2 w-full bg-gray-200 rounded-full overflow-hidden mb-2">
                             <div class="h-full ${progressBarColor} transition-all duration-300" style="width: ${percentComplete}%"></div>
                        </div>
                        <h2 class="text-lg sm:text-2xl font-bold text-slate-800 leading-tight">Группа ${isGroup1 ? '1' : '2'}</h2>
                        <p class="text-[10px] sm:text-sm text-slate-400 mt-1">Осталось самое интересное. Убираем 70%.</p>
                    </div>
                    <div class="flex-grow overflow-y-auto custom-scroll glass-panel rounded-xl p-2 sm:p-4 mb-16 sm:mb-20">
                        <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-2 sm:gap-3 pb-4">
                            ${itemsHTML}
                        </div>
                    </div>
                    <div class="absolute bottom-0 left-0 right-0 p-3 sm:p-4 bg-gradient-to-t from-white via-white to-transparent z-10 flex justify-center">
                         <button id="nextBtn" onclick="nextSemifinal()" ${btnDisabled ? 'disabled' : ''} class="game-btn ${btnClass} w-full max-w-sm py-3 px-6 rounded-xl font-bold transition-all flex items-center justify-center text-sm sm:text-base">
                            ${btnText} ${!btnDisabled ? '<i class="fas fa-arrow-right ml-2"></i>' : ''}
                        </button>
                    </div>
                </div>
            `;
        }

        function nextSemifinal() {
            const isGroup1 = gameState.stage === 'semifinal_1';
            const currentGroupIds = isGroup1 ? gameState.semifinal1_ids : gameState.semifinal2_ids;
            const activeCount = gameState.values.filter(v => currentGroupIds.includes(v.id) && v.status === 'active').length;
            const trashedCount = currentGroupIds.length - activeCount;
            const targetTrash = Math.ceil(currentGroupIds.length * 0.7);

            if (trashedCount < targetTrash) return;

            if (isGroup1) {
                gameState.stage = 'semifinal_2';
                renderSemifinalStep();
            } else {
                startFinalStage();
            }
        }

        // --- CORE MECHANICS ---
        function updateSmartProgressUI(trashedCount, targetTrash, isTargetMet, percentComplete, nextBtnText) {
            const progressHeader = document.querySelector('.text-orange-500') || document.querySelector('.text-green-600');
            if(progressHeader) {
                progressHeader.textContent = `Убрано: ${trashedCount}/${targetTrash}`;
                progressHeader.className = `text-[10px] sm:text-xs font-bold ${isTargetMet ? 'text-green-600' : 'text-orange-500'}`;
            }
            const progressBar = document.querySelector('.bg-gray-200 > div');
            if(progressBar) {
                progressBar.style.width = `${percentComplete}%`;
                progressBar.className = `h-full transition-all duration-300 ${isTargetMet ? 'bg-green-500' : 'bg-orange-400'}`;
            }
            const nextBtn = document.getElementById('nextBtn');
            if(nextBtn) {
                if(isTargetMet) {
                    nextBtn.disabled = false;
                    nextBtn.className = "game-btn bg-indigo-600 hover:bg-indigo-700 text-white shadow-lg animate-pulse w-full max-w-sm py-3 px-6 rounded-xl font-bold transition-all flex items-center justify-center text-sm sm:text-base";
                    nextBtn.innerHTML = nextBtnText + ' <i class="fas fa-arrow-right ml-2"></i>';
                } else {
                    nextBtn.disabled = true;
                    nextBtn.className = "game-btn bg-slate-300 text-slate-500 cursor-not-allowed w-full max-w-sm py-3 px-6 rounded-xl font-bold transition-all flex items-center justify-center text-sm sm:text-base";
                    nextBtn.innerHTML = `Уберите еще ${targetTrash - trashedCount}`;
                }
            }
        }

        function throwToTrash(id, element) {
            const item = gameState.values.find(v => v.id === id);
            if (!item) return;

            element.classList.add('throwing-away');
            
            setTimeout(() => {
                item.status = 'trashed';
                gameState.trash.push(item);
                updateTrashBadge();
                element.style.display = 'none';
                
                if (gameState.stage === 'filtering') {
                    const catName = gameState.categoryKeys[gameState.currentCategoryIndex];
                    const totalInCat = rawCategories[catName].length;
                    const activeCount = gameState.values.filter(v => v.category === catName && v.status === 'active').length;
                    const trashedCount = totalInCat - activeCount;
                    const targetTrash = Math.ceil(totalInCat * 0.4);
                    const isTargetMet = trashedCount >= targetTrash;
                    const percentComplete = Math.min(100, (trashedCount / targetTrash) * 100);
                    updateSmartProgressUI(trashedCount, targetTrash, isTargetMet, percentComplete, 
                        (gameState.currentCategoryIndex < gameState.categoryKeys.length - 1 ? 'Дальше' : 'К полуфиналу'));
                } else if (gameState.stage === 'semifinal_1' || gameState.stage === 'semifinal_2') {
                    const isGroup1 = gameState.stage === 'semifinal_1';
                    const currentGroupIds = isGroup1 ? gameState.semifinal1_ids : gameState.semifinal2_ids;
                    const totalInCat = currentGroupIds.length;
                    const activeCount = gameState.values.filter(v => currentGroupIds.includes(v.id) && v.status === 'active').length;
                    const trashedCount = totalInCat - activeCount;
                    const targetTrash = Math.ceil(totalInCat * 0.7);
                    const isTargetMet = trashedCount >= targetTrash;
                    const percentComplete = Math.min(100, (trashedCount / targetTrash) * 100);
                    updateSmartProgressUI(trashedCount, targetTrash, isTargetMet, percentComplete, 
                        (isGroup1 ? 'Дальше' : 'К финалу'));
                } else if (gameState.stage === 'final') {
                    const activeCount = gameState.values.filter(v => v.status === 'active').length;
                    const countDisplay = document.getElementById('finalCountDisplay');
                    if (countDisplay) {
                        countDisplay.textContent = activeCount;
                        countDisplay.parentElement.className = `text-[10px] sm:text-xs font-bold ${activeCount === 10 ? 'text-green-600' : 'text-orange-500'}`;
                    }
                    const nextBtn = document.getElementById('finishBtn');
                    if (nextBtn) {
                        if (activeCount === 10) {
                            nextBtn.disabled = false;
                            nextBtn.className = "game-btn bg-green-500 hover:bg-green-600 text-white shadow-lg animate-bounce-small w-full max-w-sm py-3 px-6 rounded-xl font-bold transition-all flex items-center justify-center text-sm sm:text-base";
                            nextBtn.innerHTML = 'Завершить <i class="fas fa-check ml-2"></i>';
                        } else if (activeCount > 10) {
                            nextBtn.disabled = true;
                            nextBtn.className = "game-btn bg-slate-300 text-slate-500 cursor-not-allowed w-full max-w-sm py-3 px-6 rounded-xl font-bold transition-all flex items-center justify-center text-sm sm:text-base";
                            nextBtn.innerHTML = `Уберите еще ${activeCount - 10}`;
                        } else {
                            nextBtn.disabled = true;
                            nextBtn.className = "game-btn bg-red-400 text-white cursor-not-allowed w-full max-w-sm py-3 px-6 rounded-xl font-bold transition-all flex items-center justify-center text-sm sm:text-base";
                            nextBtn.innerHTML = `Верните ${10 - activeCount} из корзины`;
                        }
                    }
                }
            }, 350);
        }

        function restoreFromTrash(id) {
            const index = gameState.trash.findIndex(v => v.id === id);
            if (index > -1) {
                const item = gameState.trash[index];
                item.status = 'active'; 
                gameState.trash.splice(index, 1);
                updateTrashBadge();
                renderTrashContent();
                
                if (gameState.stage === 'filtering') {
                    const currentCat = gameState.categoryKeys[gameState.currentCategoryIndex];
                    if (item.category === currentCat) {
                        renderCategoryStep(); 
                    }
                } else if (gameState.stage === 'semifinal_1') {
                    if (!gameState.semifinal1_ids.includes(id)) gameState.semifinal1_ids.push(id);
                    renderSemifinalStep();
                } else if (gameState.stage === 'semifinal_2') {
                    if (!gameState.semifinal2_ids.includes(id)) gameState.semifinal2_ids.push(id);
                    renderSemifinalStep();
                } else if (gameState.stage === 'final') {
                    renderFinalStage();
                }
            }
        }

        function updateTrashBadge() {
            const badge = document.getElementById('trashCountBadge');
            const count = gameState.trash.length;
            badge.textContent = count;
            if (count > 0) {
                badge.classList.remove('scale-0');
            } else {
                badge.classList.add('scale-0');
            }
        }

        function toggleTrashModal() {
            const modal = document.getElementById('trashModal');
            const panel = document.getElementById('trashPanel');
            if (modal.classList.contains('hidden')) {
                modal.classList.remove('hidden');
                setTimeout(() => { panel.classList.remove('translate-x-full'); }, 10);
                renderTrashContent();
            } else {
                panel.classList.add('translate-x-full');
                setTimeout(() => { modal.classList.add('hidden'); }, 300);
            }
        }

        function renderTrashContent() {
            const container = document.getElementById('trashContent');
            if (gameState.trash.length === 0) {
                container.innerHTML = `<div class="col-span-2 text-center text-slate-400 mt-10 text-xs">Пусто</div>`;
                return;
            }
            container.innerHTML = gameState.trash.map(item => `
                <div onclick="restoreFromTrash(${item.id})" class="bg-red-50 border border-red-100 p-2 rounded text-xs text-slate-700 cursor-pointer relative group">
                    <span class="font-medium truncate block">${item.text}</span>
                    <i class="fas fa-undo absolute right-1 top-2 opacity-0 group-hover:opacity-100 text-green-600"></i>
                </div>
            `).join('');
        }

        // --- FINAL STAGE ---
        function startFinalStage() {
            gameState.stage = 'final';
            renderFinalStage();
        }

        function renderFinalStage() {
            const activeItems = gameState.values.filter(v => v.status === 'active');
            const currentCount = activeItems.length;
            const targetRemaining = 10;
            const container = document.getElementById('gameArea');

            let itemsHTML = activeItems.map(item => `
                <div onclick="throwToTrash(${item.id}, this)" class="value-card bg-white border border-slate-200 rounded-lg p-2 sm:p-4 text-center cursor-pointer shadow-sm relative flex items-center justify-center min-h-[40px] sm:min-h-[70px]">
                    <span class="font-medium text-slate-700 pointer-events-none text-xs sm:text-sm break-words w-full leading-tight">${item.text}</span>
                </div>
            `).join('');

            let btnClass, btnText, btnDisabled;
            if (currentCount === targetRemaining) {
                btnDisabled = false;
                btnClass = "bg-green-500 hover:bg-green-600 text-white shadow-lg animate-bounce-small";
                btnText = 'Завершить <i class="fas fa-check ml-2"></i>';
            } else if (currentCount > targetRemaining) {
                btnDisabled = true;
                btnClass = "bg-slate-300 text-slate-500 cursor-not-allowed";
                btnText = `Уберите еще ${currentCount - targetRemaining}`;
            } else {
                btnDisabled = true;
                btnClass = "bg-red-400 text-white cursor-not-allowed";
                btnText = `Верните ${targetRemaining - currentCount} из корзины`;
            }

            container.innerHTML = `
                <div class="h-full flex flex-col card-enter w-full">
                     <div class="flex-none text-center mb-2 px-4">
                        <span class="text-indigo-500 font-bold tracking-widest uppercase text-[10px]">Финал</span>
                        <h2 class="text-xl sm:text-2xl font-bold text-slate-800">Топ-10</h2>
                        <div class="text-[10px] sm:text-xs font-bold ${currentCount === 10 ? 'text-green-600' : 'text-orange-500'} mt-1">
                             Осталось: <span id="finalCountDisplay">${currentCount}</span> / 10
                        </div>
                    </div>

                    <div class="flex-grow overflow-y-auto custom-scroll glass-panel rounded-xl p-2 sm:p-4 mb-16">
                        <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-2 sm:gap-3 pb-4">
                            ${itemsHTML}
                        </div>
                    </div>

                    <div class="absolute bottom-0 left-0 right-0 p-3 sm:p-4 bg-white/90 backdrop-blur z-10 flex justify-center border-t border-slate-100">
                        <button onclick="finishGame()" id="finishBtn" class="game-btn w-full max-w-sm py-3 px-6 rounded-xl font-bold transition-all flex items-center justify-center text-sm sm:text-base ${btnClass}" ${btnDisabled ? 'disabled' : ''}>
                            ${btnText}
                        </button>
                    </div>
                </div>
            `;
        }

        // --- RESULTS ---
        function finishGame() {
            gameState.stage = 'result';
            const top10 = gameState.values.filter(v => v.status === 'active');
            const container = document.getElementById('gameArea');

            let listHTML = top10.map((item, index) => `
                <div class="flex items-center p-3 bg-white rounded-lg shadow-sm border-l-4 border-indigo-500 mb-2">
                    <span class="text-xl font-bold text-slate-200 mr-3">#${index + 1}</span>
                    <div class="overflow-hidden">
                        <div class="text-sm sm:text-base font-bold text-slate-800 truncate">${item.text}</div>
                        <div class="text-[10px] text-indigo-400 uppercase tracking-wide truncate">${item.category}</div>
                    </div>
                </div>
            `).join('');

            container.innerHTML = `
                <div class="h-full flex flex-col card-enter max-w-md mx-auto w-full overflow-hidden">
                    <div class="flex-none text-center mb-4 mt-2">
                        <div class="w-12 h-12 sm:w-16 sm:h-16 bg-green-100 text-green-500 rounded-full flex items-center justify-center text-xl sm:text-2xl mx-auto mb-2 shadow-inner">
                            <i class="fas fa-trophy"></i>
                        </div>
                        <h2 class="text-xl font-bold text-indigo-900">Ваш Компас</h2>
                    </div>

                    <div class="flex-grow overflow-y-auto custom-scroll px-2 pb-4">
                        ${listHTML}
                    </div>

                    <div class="flex-none p-4 flex gap-2 justify-center bg-white/50 backdrop-blur">
                        <button onclick="window.print()" class="flex-1 bg-slate-800 text-white py-3 rounded-xl font-bold shadow hover:bg-slate-700 text-xs sm:text-sm">
                            <i class="fas fa-save mr-1"></i> PDF
                        </button>
                        <button onclick="location.reload()" class="flex-1 bg-white text-slate-600 border border-slate-300 py-3 rounded-xl font-bold hover:bg-slate-50 text-xs sm:text-sm">
                            Заново
                        </button>
                    </div>
                </div>
            `;
            document.querySelector('header button').style.display = 'none';
        }

        initGame();

    </script>
</body>
</html>
